<div class="food-item-con">
    <div>
       <div class="image-container">

         <img class="img"
          [src]="'./assets/' + product.image"
           [alt]="product.name"]>

       </div>
    </div>
    <div>
        <div class="name-price">

            <div class="price">
                <p>₦{{ product.price | number:'1.0-0' }}</p>
            </div>

            <button class="ATR-btn">Add to Cart <span style="font-weight: bolder;"> +</span></button>
          
        </div>

        <!-- <button class="ATR-btn">Add to Cart <span style="font-weight: bolder;"> +</span></button> -->
    </div>
     <div class="name">
                <p>{{ product.name }}</p>
            </div>
</div>
