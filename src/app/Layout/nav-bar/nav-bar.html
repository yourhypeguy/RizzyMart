<div class="nav-bar-parent navbar" [class.scrolled]="isScrolled">
    <div class="nav-bar-container">
    <div class="nav-logo-container"  routerLink="/home">
        <img class="rizzyMart_logo" src="./assets/rizzyMart_logo.Png" alt="logo-img" >
    </div>

    <div class="nav-search-bar-container">
        <div>
            <img class="search-icon"  src="./assets/search-icon.png" alt="search-icon">
        </div>

        <div class="receipt-logo-parent" (click)="toggleCart()">
            <img class="recipt-logo" src="./assets/cartIcon.gif" alt="menu-icon">

              
            <p class="product-count">{{ cartCount$ | async }}</p>
        </div>
    </div>
</div>

    <div class="search-container">
        <form action="">
            <input class="search-input" type="text" placeholder="Search products...">
            <button class="submit-button" type="submit"><span class="search-text">Search</span></button>
        </form>
    </div>


    

    <!-- CART OVERLAY -->

<!-- CART OVERLAY -->

<div
  class="cart-overlay"
  [class.show-cart]="isCartOpen"
  [class.hide-cart]="!isCartOpen"
  (click)="closeCart()"
>

    <!-- CART PANEL -->

    <div
      class="cart-panel"
      (click)="$event.stopPropagation()"
    >

        
            <div class="cart-header">

            <p>
                You have
                <span style="font-weight: 700;">
                    {{ cartCount$ | async }}
                </span>
                items in Cart
            </p>

                <div class="close-cart" (click)="closeCart()">
                    ✕
                </div>

            </div>
        
            <div class="cart-content">

                <ng-container *ngIf="cartItems$ | async as cartItems">

                    <div *ngIf="cartItems.length > 0; else emptyCart"
                        style="height: 1500px;">

                        <app-cart-item
                            *ngFor="let item of cartItems"
                            [item]="item">
                        </app-cart-item>

                    </div>

                    <ng-template #emptyCart>
                        <div class="empty-cart">
                            <h3>Your cart is empty!</h3>
                            <p>Looks like you haven't added anything to your cart yet.</p>
                        </div>
                    </ng-template>

                </ng-container>

            </div>


        <div class="cart-footer" *ngIf="(cartCount$ | async) ?? 0">
            <div class="total-price">
                <h3>Sub Total:</h3>
                 <p>₦{{ cartSubtotal$ | async | number:'1.2-2' }}</p>
            </div>

            <button class="checkout-btn">Checkout</button>

        </div>

</div>

    
</div>
